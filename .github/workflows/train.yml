name: Train and evaluate models

on:
  workflow_dispatch:
    inputs:
      csv_url:
        description: HTTPS URL of the training CSV accessible to this runner
        required: true
        type: string

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock.txt
      - name: Install training dependencies
        run: python -m pip install -c requirements.lock.txt .
      - name: Download training CSV
        env:
          CSV_URL: ${{ inputs.csv_url }}
        run: |
          python - <<'PY'
          import os
          import shutil
          import urllib.parse
          import urllib.request
          from pathlib import Path

          url = os.environ["CSV_URL"]
          if urllib.parse.urlsplit(url).scheme != "https":
              raise ValueError("Use an HTTPS CSV URL.")
          destination = Path("data/raw/data.csv")
          destination.parent.mkdir(parents=True, exist_ok=True)
          with urllib.request.urlopen(url, timeout=60) as source:
              if urllib.parse.urlsplit(source.url).scheme != "https":
                  raise ValueError("CSV redirects must remain on HTTPS.")
              with destination.open("wb") as output:
                  shutil.copyfileobj(source, output)
          PY
      - name: Select on validation and evaluate reserved test data
        run: python -m src.manage train data/raw/data.csv
      - name: Save trusted trained pipelines
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: models/loan_models.joblib
          if-no-files-found: error
          retention-days: 7
      - name: Save validation and test reports
        uses: actions/upload-artifact@v4
        with:
          name: training-metrics
          path: |
            reports/validation_metrics.csv
            reports/test_model_comparison.csv
          if-no-files-found: error
          retention-days: 7
