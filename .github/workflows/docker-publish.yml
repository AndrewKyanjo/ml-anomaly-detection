name: Publish Docker image

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  publish:
    runs-on: [self-hosted, Windows, X64, ml-project]
    timeout-minutes: 30
    env:
      ML_PROJECT_PATH: ${{ vars.ML_PROJECT_PATH }}
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ml-anomaly-detection
      CONTAINER_NAME: ml-api-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check local project and Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if (-not $env:ML_PROJECT_PATH) { throw "Set the ML_PROJECT_PATH repository variable to your local project folder." }
          $projectRoot = [IO.Path]::GetFullPath($env:ML_PROJECT_PATH).TrimEnd('\', '/')
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\', '/')
          $comparison = [StringComparison]::OrdinalIgnoreCase
          if ($projectRoot.Equals($workspaceRoot, $comparison) -or
              $projectRoot.StartsWith("$workspaceRoot\", $comparison) -or
              $workspaceRoot.StartsWith("$projectRoot\", $comparison)) {
            throw "Install the runner outside the local project so checkout cannot remove your data."
          }
          if (-not $env:DOCKERHUB_USERNAME) { throw "Set the DOCKERHUB_USERNAME repository secret." }
          if (-not $env:DOCKERHUB_TOKEN) { throw "Set the DOCKERHUB_TOKEN repository secret." }
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Copy the local trained model
        run: |
          @'
          import os
          from pathlib import Path
          import shutil

          configured = os.environ.get("ML_PROJECT_PATH", "").strip()
          if not configured:
              raise SystemExit("Set ML_PROJECT_PATH to the local project folder.")
          source = Path(configured).expanduser().resolve() / "models/loan_models.joblib"
          if not source.is_file():
              raise SystemExit("Local model not found. Run 'Train and evaluate models' first.")
          destination = Path("models/loan_models.joblib").resolve()
          if source.resolve() != destination:
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          '@ | python -
      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        run: |
          docker build --tag "$($env:IMAGE):sha-$env:GITHUB_SHA" --tag "$($env:IMAGE):latest" .
      - name: Check API with the embedded trained models
        run: |
          docker run --detach --name $env:CONTAINER_NAME --volume /app/data "$($env:IMAGE):sha-$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            $status = docker inspect --format '{{.State.Health.Status}}' $env:CONTAINER_NAME
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($status -eq "healthy") { exit 0 }
            if ($status -eq "unhealthy") { break }
            Start-Sleep -Seconds 2
          }
          docker logs $env:CONTAINER_NAME
          exit 1
      - name: Publish tested image
        run: |
          docker push "$($env:IMAGE):sha-$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker push "$($env:IMAGE):latest"
      - name: Stop test container and remove its temporary volume
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          docker container inspect $env:CONTAINER_NAME *> $null
          if ($LASTEXITCODE -eq 0) { docker rm --force --volumes $env:CONTAINER_NAME }
          exit 0
