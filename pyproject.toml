[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-anomaly-detection"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "ml-gearbox[ml,parquet]==0.1.1",
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.6,<2",
    "xgboost>=3.1,<4",
    "joblib>=1.4,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["src*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_cache/tmp"
